name: Build Probe

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: gh-actions

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (ldid + dpkg)
        run: |
          brew install ldid dpkg

      - name: Build probe
        run: |
          chmod +x build_macos.sh
          RM_PROBE=1 ./build_macos.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: EntryMaster-deb-probe
          path: gh-actions/*.deb
          if-no-files-found: error
