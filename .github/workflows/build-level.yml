name: Build Level

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'RM_LEVEL (1-5)'
        required: true
        default: '2'
      cover:
        description: 'RM_COVER (0/1/2/3)'
        required: true
        default: '0'
      debug:
        description: 'RM_DEBUG (1=blackbox log)'
        required: false
        default: ''

defaults:
  run:
    working-directory: gh-actions

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (ldid + dpkg)
        run: |
          brew install ldid dpkg

      - name: Build level
        run: |
          chmod +x build_macos.sh
          RM_LEVEL=${{ inputs.level }} RM_COVER=${{ inputs.cover }} RM_DEBUG=${{ inputs.debug }} ./build_macos.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: EntryMaster-deb-l${{ inputs.level }}-c${{ inputs.cover }}${{ inputs.debug == '1' && '-dbg' || '' }}
          path: gh-actions/*.deb
          if-no-files-found: error
